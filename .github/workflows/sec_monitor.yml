name: SEC Insider Monitor (Hourly)

on:
  schedule:
    # 週一至週五 (1-5)，每 60 分鐘 (每小時整點 0 分) 執行一次
    - cron: '0 * * * 1-5'
  workflow_dispatch: # 保留手動立即觸發按鈕

jobs:
  scan-sec-filings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run SEC Insider Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sec_insider_monitor.py

jobs:
  run-sec-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute SEC Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 執行 180 分鐘 (涵蓋美東 06:00 - 09:00 盤前核心時段)
        run: python sec_insider_monitor.py --duration 180
